spring.application.name=recommendation-service
spring.config.import=optional:configserver:http://localhost:8088

# Puerto fijo (crítico para el registro en Eureka y el enrutamiento del Gateway)
server.port=8072
springdoc.api-docs.path=/api/recommendations/v3/api-docs

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Neo4j Database
spring.neo4j.uri=${NEO4J_URI:neo4j://localhost:7687}

# Credenciales de acceso
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}
spring.data.neo4j.database=${NEO4J_DATABASE:neo4j}
spring.data.neo4j.initial-index-creation=none

# Logging
logging.level.org.neo4j.driver=INFO
logging.level.org.springframework.data.neo4j=INFO

# Azure OpenAI
spring.ai.openai.base-url=${OPENAI_BASE_URL:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}

spring.ai.openai.embedding.model=text-embedding-3-small

# Chat (comentario + moderación de la búsqueda semántica)
spring.ai.openai.chat.base-url=${OPENAI_CHAT_BASE_URL:}
spring.ai.openai.chat.api-key=${OPENAI_CHAT_API_KEY:}
spring.ai.openai.chat.model=gpt-5

# Vector store Neo4j
spring.ai.vectorstore.neo4j.index-name=Artwork_embeddings_idx
spring.ai.vectorstore.neo4j.embedding-dimension=1536
spring.ai.vectorstore.neo4j.label=Artwork
spring.ai.vectorstore.neo4j.embedding-property=embedding

