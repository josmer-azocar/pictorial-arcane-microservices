spring.application.name=recommendation-service
spring.config.import=optional:configserver:http://localhost:8088

# Puerto fijo (crítico para el registro en Eureka y el enrutamiento del Gateway)
server.port=8072
springdoc.api-docs.path=/api/recommendations/v3/api-docs

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Neo4j AuraDB
spring.neo4j.uri=neo4j+s://localhost:7687

# Credenciales de acceso
spring.neo4j.authentication.username=53ca7660
spring.neo4j.authentication.password=REDACTED
spring.data.neo4j.database=53ca7660
spring.data.neo4j.initial-index-creation=none

# Muestra la inicialización del driver, creación de canales (sockets) y el handshake con la BD
logging.level.org.neo4j.driver=DEBUG

# Muestra cómo Spring Data gestiona las sesiones y las consultas Cypher que se ejecutan
logging.level.org.springframework.data.neo4j=DEBUG

# Azure OpenAI (recurso "pictorial-arcane", eastus). El base-url terminado en
# "openai.azure.com" hace que Spring AI detecte automáticamente el modo Microsoft
# Foundry/Azure (ver OpenAiSetup.detectModelProvider en spring-ai-openai).
spring.ai.openai.base-url=https://api.openai.com/
spring.ai.openai.api-key=REDACTED

# El nombre del deployment coincide con el del modelo, así que no hace falta
# spring.ai.openai.embedding.deployment-name aparte.
spring.ai.openai.embedding.model=text-embedding-3-small

# Chat (comentario + moderación de la búsqueda semántica): recurso Foundry
# separado "pictorial-resource" (AIServices), deployment "gpt-5". El base-url
# usa el endpoint clásico "cognitiveservices.azure.com" -no el de Foundry
# Projects (.../api/projects/...)- porque ese sí lo detecta OpenAiSetup como
# Microsoft Foundry automáticamente. Se sobreescribe solo a nivel spring.ai.openai.chat.*
# para no pisar el base-url/api-key de spring.ai.openai.embedding.* (recurso
# "pictorial-arcane", distinto).
spring.ai.openai.chat.base-url=https://api.openai.com/
spring.ai.openai.chat.api-key=REDACTED
spring.ai.openai.chat.model=gpt-5

# Nombre del índice que creaste exitosamente en Neo4j
spring.ai.vectorstore.neo4j.index-name=Artwork_embeddings_idx

# Dimensión real de text-embedding-3-small (Azure OpenAI). El índice en Neo4j
# se recreó para coincidir con esto.
spring.ai.vectorstore.neo4j.embedding-dimension=1536

# La etiqueta exacta de tus nodos en producción
spring.ai.vectorstore.neo4j.label=Artwork

# El nombre del nuevo atributo donde Neo4j guardará/leerá el vector
spring.ai.vectorstore.neo4j.embedding-property=embedding
