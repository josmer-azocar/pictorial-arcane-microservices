server:
  port: 8070

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

spring:
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/pictorial-arcane}
      database: ${SPRING_MONGODB_DATABASE:pictorial-arcane}

