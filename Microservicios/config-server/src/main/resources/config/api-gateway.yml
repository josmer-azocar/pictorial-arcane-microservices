server:
  port: 8060

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Evita cabeceras CORS duplicadas cuando el servicio downstream (core-service) también las añade.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: artwork-service
              uri: lb://artwork-service
              predicates:
                - Path=/artist/**,/artwork/**,/genre/**,/migrate/**
            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/artwork-status-history/**,/billing-by-month/**,/security-log-by-event/**
            - id: core-service
              uri: lb://core-service
              predicates:
                - Path=/core/**
              filters:
                - StripPrefix=1
            - id: recommendation-service
              uri: lb://recommendation-service
              predicates:
                - Path=/api/v1/recommendations/**,/api/recommendations/**,/api/users/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    urls:
      - name: Core Service
        url: /core/v3/api-docs
      - name: Artwork Service
        url: /artwork/v3/api-docs
      - name: Audit Service
        url: /artwork-status-history/v3/api-docs
      - name: Recommendation Service
        url: /api/recommendations/v3/api-docs

