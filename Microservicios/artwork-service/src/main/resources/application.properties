spring.application.name=artwork-service
spring.config.import=optional:configserver:http://localhost:8088

server.port=8070
springdoc.api-docs.path=/artwork/v3/api-docs

#Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Configuración de MongoDB (Usar variable de entorno MONGODB_URI)
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/pictorial-arcane}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:pictorial-arcane}

# Ver las operaciones de Spring Data MongoDB
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.org.mongodb.driver.cluster=INFO

# Configuracion de Azure Blob Storage
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:${STORAGE_CONNECTION:}}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:pictorialpictures}

