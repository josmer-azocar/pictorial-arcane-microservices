spring.application.name=core-service

spring.config.import=optional:configserver:
spring.cloud.config.uri=${SPRING_CLOUD_CONFIG_URI:http://localhost:8088}

server.port=8082

#Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

#Postgres SQL
spring.datasource.driver-class-name=org.postgresql.Driver

#Spring Data JPA
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pictorial_arcane_db}
spring.datasource.username=${DB_USER:uneg}
spring.datasource.password=${DB_PASSWORD:uneg2026}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_MODE:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

#Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.docker.compose.enabled=${DOCKER_CONF:false}

